name = "vrg-arcade"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = false

routes = [{ pattern = "arcade.vrg.li", custom_domain = true }]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/mp-socket", "/api/*", "/auth/*", "/leaderboard", "/leaderboard.json", "/e", "/stats", "/stats.json", "/arcade", "/arcade/", "/vs/*", "/play/tariff-wars", "/play/brux", "/play/brux/*", "/play/wallop"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Stats"]

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Accounts"]
